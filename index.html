<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Maktab ma’lumotlari, davomat, murojaatlar va inventarni boshqarish platformasi">
  <title>Raqamli maktab — boshqaruv platformasi</title>
  <style>
    :root{--navy:#15375d;--navy2:#0d2948;--blue:#2e74b5;--green:#548235;--amber:#c99400;--red:#c64242;--ink:#17243a;--muted:#68758a;--line:#dce4ed;--canvas:#f4f7fb;--white:#fff}
    *{box-sizing:border-box}html{background:var(--canvas)}body{margin:0;color:var(--ink);background:var(--canvas);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;display:flex;flex-direction:column;height:100vh;padding:24px 17px;color:#dfeaff;background:linear-gradient(180deg,var(--navy),var(--navy2))}.brand{display:flex;align-items:center;gap:11px;padding:0 7px 25px;border-bottom:1px solid #ffffff1f}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;color:var(--navy);background:#fff;font-size:13px;font-weight:900}.brand strong,.brand small{display:block}.brand strong{color:#fff;font-size:14px}.brand small{margin-top:3px;color:#9fb6d0;font-size:10px}.nav-label{margin:27px 11px 10px;color:#7796b8;font-size:9px;font-weight:900;letter-spacing:.14em}.nav-button{display:flex;align-items:center;gap:11px;width:100%;margin:3px 0;padding:10px 11px;border:0;border-radius:11px;color:#bad0e8;background:transparent;text-align:left;font-size:13px;font-weight:650}.nav-button:hover,.nav-button.active{color:#fff;background:#5b9bd533}.nav-button.active{box-shadow:inset 3px 0 #76bbf2}.nav-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#ffffff12;font-size:10px;font-weight:900}.sync-box{display:flex;align-items:center;gap:10px;margin-top:auto;padding:13px;border:1px solid #ffffff19;border-radius:14px;background:#ffffff0a}.sync-dot{width:9px;height:9px;border-radius:50%;background:#6dd69b;box-shadow:0 0 0 5px #6dd69b1f}.sync-box strong,.sync-box small{display:block}.sync-box strong{color:#fff;font-size:11px}.sync-box small{margin-top:3px;color:#8fa9c7;font-size:9px}.workspace{min-width:0}.topbar{position:sticky;z-index:10;top:0;display:flex;align-items:center;justify-content:space-between;min-height:78px;padding:14px 30px;border-bottom:1px solid var(--line);background:#fffffff0;backdrop-filter:blur(15px)}.eyebrow,.kicker{margin:0;color:var(--blue);font-size:9px;font-weight:900;letter-spacing:.11em}.topbar h1{margin:4px 0 0;font-size:19px}.top-actions{display:flex;align-items:center;gap:9px}.search{display:flex;align-items:center;gap:7px;width:min(310px,30vw);height:40px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:#f8fafc;color:#8c98aa}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:12px}.profile{display:flex;align-items:center;gap:8px;padding:3px 7px 3px 3px;border:0;background:transparent;text-align:left}.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;color:#fff;background:var(--navy);font-size:10px;font-weight:900}.profile strong,.profile small{display:block}.profile strong{font-size:11px}.profile small{margin-top:2px;color:var(--muted);font-size:9px}.content{width:min(1420px,100%);margin:auto;padding:26px 30px 46px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}.heading h2{margin:6px 0 4px;font-size:27px;letter-spacing:-.035em}.heading p:last-child{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px}.primary,.secondary{height:40px;padding:0 14px;border-radius:11px;font-size:11px;font-weight:800}.primary{border:0;color:#fff;background:var(--blue);box-shadow:0 8px 20px #2e74b533}.secondary{border:1px solid var(--line);color:#58677b;background:#fff}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.metric{display:flex;align-items:center;gap:13px;min-height:108px;padding:17px;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 8px 25px #17365d0d}.metric-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;font-size:12px;font-weight:900}.metric.blue .metric-icon{color:var(--blue);background:#eaf3fb}.metric.green .metric-icon{color:var(--green);background:#eaf5e5}.metric.amber .metric-icon{color:var(--amber);background:#fff5d6}.metric.red .metric-icon{color:var(--red);background:#fdeceb}.metric span,.metric strong,.metric small{display:block}.metric span{color:var(--muted);font-size:10px;font-weight:700}.metric strong{margin:3px 0;font-size:24px}.metric small{color:#79918a;font-size:9px}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,.8fr);gap:13px;margin-top:13px}.panel{border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 8px 25px #17365d0a}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:19px 20px 8px}.panel-head h3{margin:4px 0 0;font-size:16px}.chart{display:flex;align-items:flex-end;justify-content:space-around;height:238px;margin:8px 22px 17px;padding:18px 8px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 53px,#edf1f5 54px)}.bar-col{display:flex;align-items:center;flex-direction:column;justify-content:flex-end;width:50px;height:100%}.bar-col b{margin-bottom:5px;font-size:9px}.bar{width:30px;border-radius:7px 7px 2px 2px;background:linear-gradient(#529ddb,var(--blue))}.bar.warn{background:linear-gradient(#e3b83d,#bf9000)}.bar-col small{margin-top:7px;color:var(--muted);font-size:9px}.alerts{padding:7px 17px 16px}.alert{display:grid;grid-template-columns:31px 1fr auto;align-items:center;gap:9px;width:100%;padding:12px 3px;border:0;border-bottom:1px solid #edf1f5;background:transparent;text-align:left}.alert>span{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;font-size:10px;font-weight:900}.alert.red>span{color:var(--red);background:#fdeceb}.alert.amber>span{color:var(--amber);background:#fff5d6}.alert.blue>span{color:var(--blue);background:#eaf3fb}.alert strong,.alert small{display:block}.alert strong{font-size:10px}.alert small{margin-top:3px;color:var(--muted);font-size:8px}.alert b{color:var(--blue);font-size:9px}.table-panel{margin-top:13px;overflow:hidden}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 19px 8px}.toolbar strong,.toolbar small{display:block}.toolbar strong{font-size:13px}.toolbar small{margin-top:3px;color:var(--muted);font-size:9px}.table-wrap{overflow-x:auto;padding:4px 13px 12px}table{width:100%;min-width:730px;border-collapse:collapse}th,td{padding:11px 9px;border-bottom:1px solid #edf1f5;text-align:left;font-size:10px}th{color:#8a96a8;font-size:8px;letter-spacing:.07em;text-transform:uppercase}td{color:#58667a}td strong{color:var(--ink)}.code{display:inline-block;padding:4px 7px;border-radius:7px;color:var(--navy);background:#eef4fa;font-family:Consolas,monospace;font-size:9px;font-weight:800}.badge{display:inline-block;padding:5px 8px;border-radius:999px;color:#68758a;background:#eef2f6;font-size:8px;font-weight:900}.badge.green{color:var(--green);background:#eaf5e5}.badge.amber{color:#936d00;background:#fff5d6}.badge.red{color:var(--red);background:#fdeceb}.badge.blue{color:var(--blue);background:#eaf3fb}.person{display:flex;align-items:center;gap:8px}.person>span{display:grid;place-items:center;width:29px;height:29px;border-radius:8px;color:var(--blue);background:#eaf3fb;font-size:8px;font-weight:900}.empty{padding:38px;text-align:center;color:var(--muted);font-size:11px}.summary{display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#fff}.summary>div{padding:18px 22px;border-right:1px solid var(--line)}.summary>div:last-child{border:0}.summary span,.summary strong,.summary small{display:block}.summary span{color:var(--muted);font-size:9px;font-weight:800}.summary strong{margin:5px 0 2px;font-size:22px}.summary small{color:#8a96a8;font-size:9px}.donut-wrap{display:flex;align-items:center;justify-content:center;gap:26px;padding:30px 20px 38px}.donut{display:grid;place-items:center;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--green) 0 44%,var(--amber) 44% 66%,var(--red) 66%)}.donut:before{content:"";grid-area:1/1;width:82px;height:82px;border-radius:50%;background:#fff}.donut span{z-index:1;grid-area:1/1;text-align:center}.donut strong,.donut small{display:block}.donut strong{font-size:21px}.donut small{color:var(--muted);font-size:9px}.legend{display:grid;gap:12px;width:155px;margin:0;padding:0;list-style:none}.legend li{display:grid;grid-template-columns:9px 1fr auto;align-items:center;gap:7px;color:var(--muted);font-size:9px}.legend i{width:8px;height:8px;border-radius:50%}.report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.report{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;padding:18px;border:1px solid var(--line);border-radius:17px;background:#fff}.report-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;color:var(--blue);background:#eaf3fb;font-size:9px;font-weight:900}.report h3{margin:0;font-size:13px}.report p{margin:4px 0 0;color:var(--muted);font-size:9px}.report button{padding:7px 9px;border:1px solid var(--line);border-radius:8px;color:var(--blue);background:#fff;font-size:9px;font-weight:800}.modal-bg{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:18px;background:#0b223d99;backdrop-filter:blur(6px)}.modal{width:min(510px,100%);padding:23px;border-radius:20px;background:#fff;box-shadow:0 28px 70px #0a1e344d}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:19px}.modal-head span{color:var(--blue);font-size:8px;font-weight:900;letter-spacing:.11em}.modal-head h2{margin:5px 0 0;font-size:21px}.close{width:33px;height:33px;border:0;border-radius:9px;color:var(--muted);background:#f0f3f7;font-size:21px}.modal form{display:grid;gap:13px}.modal label{display:grid;gap:6px;font-size:10px;font-weight:800}.modal input,.modal select{width:100%;height:40px;padding:0 11px;border:1px solid var(--line);border-radius:9px;outline:0;background:#fff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:7px}.toast{position:fixed;z-index:120;right:24px;bottom:24px;padding:12px 16px;border-radius:11px;color:#fff;background:var(--navy);box-shadow:0 12px 30px #102b4b4d;font-size:11px;font-weight:800}.hidden{display:none!important}
    @media(max-width:1050px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.search{display:none}}
    @media(max-width:730px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;z-index:30;top:auto;bottom:0;width:100%;height:64px;padding:7px 10px}.brand,.nav-label,.sync-box,.nav-button span:last-child{display:none}.sidebar nav{display:flex;justify-content:space-around}.nav-button{width:auto;margin:0;padding:7px 10px}.nav-button.active{box-shadow:none}.workspace{padding-bottom:64px}.topbar{padding:13px 17px}.profile span:last-child{display:none}.content{padding:21px 17px 34px}.heading{align-items:flex-start;flex-direction:column}.heading h2{font-size:23px}.heading .actions{width:100%}.heading .actions button{flex:1}.summary{grid-template-columns:repeat(2,1fr)}.report-grid{grid-template-columns:1fr}}
    @media(max-width:470px){.metrics,.summary{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.profile{display:none}.report{grid-template-columns:auto 1fr}.report button{grid-column:1/-1}.toast{right:16px;bottom:78px;left:16px}}
  </style>
</head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">RM</span><span><strong>Raqamli maktab</strong><small>Boshqaruv platformasi</small></span></div>
      <nav id="nav"><p class="nav-label">BOSHQARUV</p></nav>
      <div class="sync-box"><span class="sync-dot"></span><div><strong>Mahalliy baza faol</strong><small>O‘zgarishlar avtomatik saqlanadi</small></div></div>
    </aside>
    <section class="workspace">
      <header class="topbar"><div><p class="eyebrow" id="today"></p><h1 id="viewName">Bosh sahifa</h1></div><div class="top-actions"><label class="search"><span>⌕</span><input id="search" placeholder="O‘quvchi, sinf yoki murojaat..." aria-label="Qidirish"></label><button class="profile"><span class="avatar">AM</span><span><strong>Azizbek Mirzayev</strong><small>Direktor</small></span></button></div></header>
      <div class="content"><section class="heading"><div><p class="kicker" id="kicker"></p><h2 id="title"></h2><p id="description"></p></div><div class="actions"><button class="secondary" id="backup">↓ JSON nusxa</button><button class="primary" id="add">＋ Yangi yozuv</button></div></section><div id="content"></div></div>
    </section>
  </main>
  <div id="modal" class="modal-bg hidden"></div><div id="toast" class="toast hidden"></div>
  <script>
    const STORAGE_KEY='raqamli-maktab-offline-v1';
    const defaultData={students:[
      {id:1,code:'RM-00128',name:'Muhammadali Rahimov',className:'7-A',parent:'Dilshod Rahimov',phone:'+998 90 123 45 67',status:'Faol'},
      {id:2,code:'RM-00129',name:'Madina Qodirova',className:'6-B',parent:'Malika Qodirova',phone:'+998 93 455 21 10',status:'Faol'},
      {id:3,code:'RM-00130',name:'Azizbek Sodiqov',className:'8-B',parent:'Jasur Sodiqov',phone:'+998 97 700 18 20',status:'Faol'},
      {id:4,code:'RM-00131',name:'Ziyoda Ergasheva',className:'5-A',parent:'Nodira Ergasheva',phone:'+998 99 310 08 40',status:'Nazoratda'}],
      requests:[{id:1,no:'MR-0241',requester:'Ota-ona',category:'Ta’lim',subject:'To‘garak jadvalini aniqlashtirish',priority:'O‘rta',status:'Yangi',due:'26-avg'},{id:2,no:'MR-0240',requester:'O‘qituvchi',category:'Texnik',subject:'7-xonada proyektor ishlamayapti',priority:'Yuqori',status:'Jarayonda',due:'25-avg'},{id:3,no:'MR-0239',requester:'O‘quvchi',category:'Xizmat',subject:'Kutubxona kartasini yangilash',priority:'Past',status:'Yopilgan',due:'28-avg'}],
      inventory:[{id:1,code:'INV-2048',name:'Epson EB-X06 proyektor',room:'7-xona',condition:'Ta’mirda',priority:'Yuqori',owner:'A. Sobirov'},{id:2,code:'INV-1982',name:'Lenovo ThinkCentre M70',room:'IT-1',condition:'Soz',priority:'Past',owner:'B. Xudoyorov'},{id:3,code:'INV-1851',name:'Interaktiv doska',room:'12-xona',condition:'Tekshiruvda',priority:'O‘rta',owner:'A. Sobirov'}]};
    const classes=[{name:'5-A',teacher:'D. Karimova',students:31,value:96,status:'Yuqori'},{name:'6-B',teacher:'M. Rashidov',students:29,value:93,status:'Barqaror'},{name:'7-A',teacher:'N. Ergasheva',students:30,value:89,status:'E’tibor'},{name:'8-B',teacher:'A. Usmonov',students:28,value:94,status:'Barqaror'}];
    const week=[{day:'Du',value:96},{day:'Se',value:94},{day:'Ch',value:97},{day:'Pa',value:91},{day:'Ju',value:93}];
    const views={dashboard:['BS','Bosh sahifa','BUGUNGI HOLAT','Maktab boshqaruvi bir ekranda','Asosiy ko‘rsatkichlar, xavf signallari va keyingi harakatlar.'],students:['O‘','O‘quvchilar','YAGONA REYESTR','O‘quvchilar ma’lumotlar bazasi','Shaxsiy ma’lumotlar, sinf va ota-ona aloqalarini boshqaring.'],attendance:['Da','Davomat','NAZORAT VA TAHLIL','Davomat monitoringi','Sinf kesimidagi holat va erta ogohlantirish signallari.'],requests:['Mu','Murojaatlar','SERVICE DESK','Murojaatlar markazi','So‘rovlarni muddat va ustuvorlik bo‘yicha kuzating.'],inventory:['In','Inventar','MODDIY RESURSLAR','Inventar nazorati','Jihozlar holati va ta’mirlash jarayonini boshqaring.'],reports:['Hi','Hisobotlar','DATA-DRIVEN MANAGEMENT','Tahliliy hisobotlar','Qarorlar uchun tayyor ko‘rsatkichlar va eksportlar.']};
    let state=load(),view='dashboard',query='';
    function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||structuredClone(defaultData)}catch(e){return structuredClone(defaultData)}}
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
    function esc(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function badge(value){const cls=['Faol','Yopilgan','Soz'].includes(value)?'green':['Yuqori','E’tibor','Ta’mirda'].includes(value)?'red':['Jarayonda','O‘rta','Tekshiruvda','Nazoratda'].includes(value)?'amber':'blue';return `<span class="badge ${cls}">${esc(value)}</span>`}
    function notify(text){const el=document.querySelector('#toast');el.textContent='✓ '+text;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2300)}
    function init(){document.querySelector('#today').textContent=new Intl.DateTimeFormat('uz-UZ',{dateStyle:'full'}).format(new Date()).toUpperCase();document.querySelector('#nav').insertAdjacentHTML('beforeend',Object.entries(views).map(([id,v])=>`<button class="nav-button ${id==='dashboard'?'active':''}" data-view="${id}"><span class="nav-icon">${v[0]}</span><span>${v[1]}</span></button>`).join(''));document.querySelector('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;query='';document.querySelector('#search').value='';render()});document.querySelector('#search').addEventListener('input',e=>{query=e.target.value.toLowerCase();renderContent()});document.querySelector('#add').addEventListener('click',openModal);document.querySelector('#backup').addEventListener('click',backup);document.querySelector('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))closeModal()});render()}
    function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const v=views[view];document.querySelector('#viewName').textContent=v[1];document.querySelector('#kicker').textContent=v[2];document.querySelector('#title').textContent=v[3];document.querySelector('#description').textContent=v[4];document.querySelector('#add').style.display=view==='attendance'||view==='reports'?'none':'';renderContent()}
    function renderContent(){const root=document.querySelector('#content');root.innerHTML=view==='dashboard'?dashboard():view==='students'?students():view==='attendance'?attendance():view==='requests'?requests():view==='inventory'?inventory():reports();bindActions()}
    function metrics(){return `<section class="metrics"><article class="metric blue"><span class="metric-icon">O‘</span><div><span>Jami o‘quvchi</span><strong>${state.students.length}</strong><small>Mahalliy bazadagi yozuvlar</small></div></article><article class="metric green"><span class="metric-icon">%</span><div><span>Bugungi davomat</span><strong>92.8%</strong><small>↗ 1.6% o‘tgan haftaga</small></div></article><article class="metric amber"><span class="metric-icon">M</span><div><span>Ochiq murojaatlar</span><strong>${state.requests.filter(x=>x.status!=='Yopilgan').length}</strong><small>Jarayondagi so‘rovlar</small></div></article><article class="metric red"><span class="metric-icon">!</span><div><span>Ta’mirdagi jihoz</span><strong>${state.inventory.filter(x=>x.condition==='Ta’mirda').length}</strong><small>Mas’ullarga biriktirilgan</small></div></article></section>`}
    function dashboard(){return metrics()+`<section class="grid"><article class="panel"><div class="panel-head"><div><p class="kicker">DAVOMAT DINAMIKASI</p><h3>Haftalik ko‘rsatkich</h3></div>${badge('94.2% o‘rtacha')}</div><div class="chart">${week.map(x=>`<div class="bar-col"><b>${x.value}%</b><div class="bar ${x.value<92?'warn':''}" style="height:${(x.value-80)*10}px"></div><small>${x.day}</small></div>`).join('')}</div></article><article class="panel"><div class="panel-head"><div><p class="kicker">E’TIBOR TALAB QILADI</p><h3>Faol signallar</h3></div>${badge('3 ta')}</div><div class="alerts"><button class="alert red" data-jump="attendance"><span>!</span><div><strong>7-A sinf davomatida pasayish</strong><small>89% • Chegaradan 3% past</small></div><b>Ko‘rish</b></button><button class="alert amber" data-jump="requests"><span>⌛</span><div><strong>Murojaatlar muddati yaqin</strong><small>Bugun ko‘rib chiqish kerak</small></div><b>Ko‘rish</b></button><button class="alert blue" data-jump="inventory"><span>i</span><div><strong>Inventar tekshiruvi</strong><small>Kompyuter xonasi</small></div><b>Ko‘rish</b></button></div></article></section>`+classTable()}
    function classTable(){return `<section class="panel table-panel"><div class="panel-head"><div><p class="kicker">SINF KESIMIDA</p><h3>Bugungi davomat</h3></div></div><div class="table-wrap"><table><thead><tr><th>Sinf</th><th>Sinf rahbari</th><th>O‘quvchilar</th><th>Davomat</th><th>Holat</th></tr></thead><tbody>${classes.map(x=>`<tr><td><strong>${x.name}</strong></td><td>${x.teacher}</td><td>${x.students} nafar</td><td><strong>${x.value}%</strong></td><td>${badge(x.status)}</td></tr>`).join('')}</tbody></table></div></section>`}
    function students(){const rows=state.students.filter(x=>(x.name+x.className+x.code).toLowerCase().includes(query));return `<section class="panel table-panel" style="margin-top:0"><div class="toolbar"><div><strong>${rows.length} ta yozuv</strong><small>O‘quvchi profillari va aloqa ma’lumotlari</small></div><button class="secondary" data-csv="students">↓ CSV</button></div><div class="table-wrap"><table><thead><tr><th>ID raqam</th><th>F.I.Sh.</th><th>Sinf</th><th>Ota-ona / vakil</th><th>Telefon</th><th>Holat</th></tr></thead><tbody>${rows.map(x=>`<tr><td><span class="code">${esc(x.code)}</span></td><td><div class="person"><span>${esc(x.name.split(' ').map(y=>y[0]).join('').slice(0,2))}</span><strong>${esc(x.name)}</strong></div></td><td><strong>${esc(x.className)}</strong></td><td>${esc(x.parent)}</td><td>${esc(x.phone)}</td><td>${badge(x.status)}</td></tr>`).join('')}</tbody></table></div>${rows.length?'':'<div class="empty">Natija topilmadi</div>'}</section>`}
    function attendance(){return `<section class="summary"><div><span>Bugun</span><strong>92.8%</strong><small>1 192 nafar qatnashdi</small></div><div><span>Sababli</span><strong>61</strong><small>4.7% o‘quvchi</small></div><div><span>Sababsiz</span><strong>31</strong><small>2.5% o‘quvchi</small></div><div><span>Xavf guruhi</span><strong>12</strong><small>3+ kun qoldirgan</small></div></section><section class="grid"><article class="panel"><div class="panel-head"><div><p class="kicker">5 KUNLIK TREND</p><h3>Davomat o‘zgarishi</h3></div>${badge('Maqsad bajarildi')}</div><div class="chart">${week.map(x=>`<div class="bar-col"><b>${x.value}%</b><div class="bar ${x.value<92?'warn':''}" style="height:${(x.value-80)*10}px"></div><small>${x.day}</small></div>`).join('')}</div></article><article class="panel"><div class="panel-head"><div><p class="kicker">SABABLAR</p><h3>Qoldirish tarkibi</h3></div></div><div class="donut-wrap"><div class="donut"><span><strong>92</strong><small>jami</small></span></div><ul class="legend"><li><i style="background:var(--green)"></i>Kasallik <b>41</b></li><li><i style="background:var(--amber)"></i>Oilaviy sabab <b>20</b></li><li><i style="background:var(--red)"></i>Sababsiz <b>31</b></li></ul></div></article></section>`+classTable()}
    function requests(){const rows=state.requests.filter(x=>(x.no+x.subject+x.requester).toLowerCase().includes(query));return `<section class="summary"><div><span>Yangi</span><strong>${rows.filter(x=>x.status==='Yangi').length}</strong><small>Navbatdagi so‘rovlar</small></div><div><span>Jarayonda</span><strong>${rows.filter(x=>x.status==='Jarayonda').length}</strong><small>Mas’ulga biriktirilgan</small></div><div><span>Yopilgan</span><strong>${rows.filter(x=>x.status==='Yopilgan').length}</strong><small>Yakunlangan</small></div><div><span>SLA</span><strong>94%</strong><small>Muddatida bajarilgan</small></div></section><section class="panel table-panel"><div class="toolbar"><div><strong>${rows.length} ta murojaat</strong><small>Holat ustiga bosib keyingi bosqichga o‘tkazing</small></div><button class="secondary" data-csv="requests">↓ CSV</button></div><div class="table-wrap"><table><thead><tr><th>Raqam</th><th>Murojaatchi</th><th>Mavzu</th><th>Ustuvorlik</th><th>Muddat</th><th>Holat</th></tr></thead><tbody>${rows.map(x=>`<tr><td><span class="code">${esc(x.no)}</span></td><td>${esc(x.requester)}<br><small>${esc(x.category)}</small></td><td><strong>${esc(x.subject)}</strong></td><td>${badge(x.priority)}</td><td>${esc(x.due)}</td><td><button style="border:0;background:transparent" data-cycle="${x.id}">${badge(x.status)}</button></td></tr>`).join('')}</tbody></table></div>${rows.length?'':'<div class="empty">Natija topilmadi</div>'}</section>`}
    function inventory(){const rows=state.inventory.filter(x=>(x.code+x.name+x.room).toLowerCase().includes(query));return metrics()+`<section class="panel table-panel"><div class="toolbar"><div><strong>${rows.length} ta inventar yozuvi</strong><small>Jihoz holati va mas’ul shaxslar</small></div><button class="secondary" data-csv="inventory">↓ CSV</button></div><div class="table-wrap"><table><thead><tr><th>Inventar kodi</th><th>Jihoz</th><th>Joylashuv</th><th>Mas’ul</th><th>Ustuvorlik</th><th>Holat</th></tr></thead><tbody>${rows.map(x=>`<tr><td><span class="code">${esc(x.code)}</span></td><td><strong>${esc(x.name)}</strong></td><td>${esc(x.room)}</td><td>${esc(x.owner)}</td><td>${badge(x.priority)}</td><td>${badge(x.condition)}</td></tr>`).join('')}</tbody></table></div>${rows.length?'':'<div class="empty">Natija topilmadi</div>'}</section>`}
    function reports(){return `<section class="report-grid"><article class="report"><span class="report-icon">DA</span><div><h3>Davomat hisoboti</h3><p>Sinf va davr kesimida tahlil</p></div><button data-csv="attendance">Yuklash ↓</button></article><article class="report"><span class="report-icon">O‘</span><div><h3>O‘quvchilar reyestri</h3><p>Aloqa va sinf ma’lumotlari</p></div><button data-csv="students">Yuklash ↓</button></article><article class="report"><span class="report-icon">MR</span><div><h3>Murojaatlar SLA</h3><p>Muddat va bajarilish holati</p></div><button data-csv="requests">Yuklash ↓</button></article><article class="report"><span class="report-icon">IN</span><div><h3>Inventar holati</h3><p>Jihozlar va mas’ullar</p></div><button data-csv="inventory">Yuklash ↓</button></article></section><section class="panel table-panel"><div class="panel-head"><div><p class="kicker">30–60–90 KUNLIK YO‘L XARITASI</p><h3>Raqamli transformatsiya holati</h3></div>${badge('64% bajarildi')}</div><div class="summary" style="border:0"><div><span>30 KUN</span><strong>100%</strong><small>Jarayonlarni xaritalash</small></div><div><span>60 KUN</span><strong>72%</strong><small>Pilot avtomatlashtirish</small></div><div><span>90 KUN</span><strong>28%</strong><small>Masshtablash va KPI</small></div><div><span>UMUMIY</span><strong>64%</strong><small>Reja bajarilishi</small></div></div></section>`}
    function bindActions(){document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{view=b.dataset.jump;render()});document.querySelectorAll('[data-cycle]').forEach(b=>b.onclick=()=>{const row=state.requests.find(x=>x.id==b.dataset.cycle),order=['Yangi','Jarayonda','Yopilgan'];row.status=order[(order.indexOf(row.status)+1)%3];save();renderContent();notify('Murojaat holati saqlandi')});document.querySelectorAll('[data-csv]').forEach(b=>b.onclick=()=>exportCsv(b.dataset.csv))}
    function openModal(){const type=view==='requests'?'request':view==='inventory'?'inventory':'student';const titles={student:'Yangi o‘quvchi',request:'Yangi murojaat',inventory:'Yangi inventar'};const fields=type==='student'?`<label>O‘quvchi F.I.Sh.<input name="name" required placeholder="Ali Valiyev"></label><div class="form-grid"><label>Sinf<select name="className"><option>5-A</option><option>6-B</option><option>7-A</option><option>8-B</option><option>9-A</option></select></label><label>Telefon<input name="phone" required placeholder="+998 90 000 00 00"></label></div><label>Ota-ona / vakil<input name="parent" required></label>`:type==='request'?`<label>Murojaat mavzusi<input name="subject" required></label><div class="form-grid"><label>Murojaatchi<select name="requester"><option>Ota-ona</option><option>O‘qituvchi</option><option>O‘quvchi</option></select></label><label>Toifa<select name="category"><option>Ta’lim</option><option>Texnik</option><option>Davomat</option><option>Xizmat</option></select></label></div><label>Ustuvorlik<select name="priority"><option>O‘rta</option><option>Yuqori</option><option>Past</option></select></label>`:`<label>Jihoz nomi<input name="name" required></label><div class="form-grid"><label>Xona<input name="room" required></label><label>Ustuvorlik<select name="priority"><option>Past</option><option>O‘rta</option><option>Yuqori</option></select></label></div><label>Mas’ul shaxs<input name="owner" required></label>`;const modal=document.querySelector('#modal');modal.innerHTML=`<section class="modal"><div class="modal-head"><div><span>MA’LUMOTLAR BAZASI</span><h2>${titles[type]}</h2></div><button class="close" data-close>×</button></div><form id="recordForm">${fields}<div class="modal-actions"><button type="button" class="secondary" data-close>Bekor qilish</button><button class="primary">Saqlash</button></div></form></section>`;modal.classList.remove('hidden');document.querySelector('#recordForm').onsubmit=e=>addRecord(e,type)}
    function closeModal(){document.querySelector('#modal').classList.add('hidden')}
    function addRecord(e,type){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(type==='student')state.students.unshift({id:Date.now(),code:'RM-'+String(state.students.length+133).padStart(5,'0'),name:f.name,className:f.className,parent:f.parent,phone:f.phone,status:'Faol'});if(type==='request')state.requests.unshift({id:Date.now(),no:'MR-'+(242+state.requests.length),requester:f.requester,category:f.category,subject:f.subject,priority:f.priority,status:'Yangi',due:'29-avg'});if(type==='inventory')state.inventory.unshift({id:Date.now(),code:'INV-'+(2100+state.inventory.length),name:f.name,room:f.room,condition:'Soz',priority:f.priority,owner:f.owner});save();closeModal();renderContent();notify('Yangi yozuv saqlandi')}
    function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
    function backup(){download('raqamli-maktab-backup.json',JSON.stringify(state,null,2),'application/json');notify('JSON zaxira nusxasi yuklandi')}
    function exportCsv(type){let rows;if(type==='students')rows=state.students.map(x=>[x.code,x.name,x.className,x.parent,x.phone,x.status]);else if(type==='requests')rows=state.requests.map(x=>[x.no,x.requester,x.category,x.subject,x.priority,x.status,x.due]);else if(type==='inventory')rows=state.inventory.map(x=>[x.code,x.name,x.room,x.owner,x.priority,x.condition]);else rows=classes.map(x=>[x.name,x.teacher,x.students,x.value+'%',x.status]);const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');download('raqamli-maktab-'+type+'.csv',csv,'text/csv');notify('CSV hisoboti yuklandi')}
    init();
  </script>
</body>
</html>
